<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小小宠物 · 迷你画布工坊</title><link rel="stylesheet" href="style.css?v=20261015-petpet1"></head><body><main><div class="garden-banner">Image to GIF</div><div class="workspace compact"><section class="editor original-card"><div class="section-head"><h2>原图</h2><button id="reset" class="text-button">默认图 ↺</button></div><label id="drop" class="upload"><div class="photo-stage"><img id="original" src="default.jpg" alt="默认豚鼠照片"><canvas id="selection" aria-label="拖动框选宠物" hidden></canvas></div><span class="upload-cover">↑ 点击或拖入，换一张照片</span><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><div class="crop-actions"><button id="crop-toggle" type="button" aria-pressed="false" class="tool-button">框选宠物</button><button id="crop-clear" class="text-button" hidden>清除选框</button></div><div class="file-note"><span id="filename">小波.jpg</span></div></section><section class="result"><div class="section-head"><h2>产出图</h2><span id="dimensions">250 × 250 px</span></div><div class="preview" id="preview"><div id="empty"><span>✿</span><p>抠图后预览</p></div><img id="result" alt="透明 GIF 导出效果预览" hidden></div><div class="preview-caption"><span>透明 GIF</span><span>静态 · 透明底</span></div></section></div><div class="main-actions"><button id="remove" class="primary">✦ 自动抠图</button><button id="download" class="primary download" disabled>↓ 下载 GIF</button></div><p id="status" role="status" aria-live="polite">照片仅在本地处理 · 首次抠图需下载模型</p><button id="petpet-open" class="petpet-open tool-button" disabled>✋ 一键制作摸头 GIF</button><section id="petpet-panel" class="settings petpet-panel" hidden><h2>摸摸小可爱</h2><div class="petpet-workspace"><div class="petpet-stage"><img id="petpet-preview" alt="摸头动画预览"></div><div class="petpet-controls"><label for="petpet-speed">速度 <output id="petpet-speed-value">16 fps</output></label><input id="petpet-speed" type="range" min="4" max="30" value="16"><label for="petpet-scale">大小 <output id="petpet-scale-value">78%</output></label><input id="petpet-scale" type="range" min="40" max="82" value="78"><label for="petpet-squish">按压幅度 <output id="petpet-squish-value">125%</output></label><input id="petpet-squish" type="range" min="30" max="180" value="125"><button id="petpet-download" class="primary download" disabled>↓ 下载摸头 GIF</button></div></div><p id="petpet-status" role="status" aria-live="polite"></p><p class="petpet-credit">手掌素材与动作参考：<a href="https://xhnav.com/petpet/" target="_blank" rel="noreferrer">摸头杀生成器</a></p></section><section class="settings"><h2>尺寸与描边</h2><label class="field-label">画布尺寸 <small>px</small></label><div id="sizes" class="sizes"><button data-size="50">50 × 50</button><button data-size="100">100 × 100</button><button class="selected" data-size="250">250 × 250</button><button data-size="500">500 × 500</button></div><div class="row"><label class="field-label" for="outline">添加描边</label><input type="checkbox" id="outline" checked></div><div id="colors" class="colors"><button data-color="#ffffff" style="--color:#ffffff" class="active" aria-label="白色"></button><button data-color="#272c29" style="--color:#272c29" aria-label="深灰"></button><button data-color="#d6ed8c" style="--color:#d6ed8c" aria-label="青柠绿"></button><button data-color="#ffb2c5" style="--color:#ffb2c5" aria-label="粉色"></button><button data-color="#b5a4ed" style="--color:#b5a4ed" aria-label="紫色"></button><button data-color="#8ecce5" style="--color:#8ecce5" aria-label="蓝色"></button><label class="custom">自定义 <input id="color" type="color" value="#ffffff" aria-label="自定义描边颜色"></label></div><div class="row"><label class="field-label" for="width">描边粗细</label><output id="width-label">4 px</output></div><input id="width" type="range" min="1" max="20" value="4"><div class="range-labels"><span>细一点</span><span>粗一点</span></div></section><details id="retouch" hidden><summary>擦除／恢复修边</summary><div class="section-head"><h2>修边</h2><button id="undo" class="text-button" disabled>撤销</button></div><div id="brush-modes" class="brush-modes"><button data-mode="erase" class="tool-button selected" aria-pressed="true">擦除</button><button data-mode="restore" class="tool-button" aria-pressed="false">恢复</button><label for="brush-size">画笔 <output id="brush-label">20</output></label><input id="brush-size" type="range" min="3" max="60" value="20"></div><canvas id="retouch-canvas" aria-label="用画笔擦除或恢复照片区域"></canvas><p class="retouch-note">淡色是原图参考，拖动修边；恢复可找回误删部位。</p></details></main><script type="module" src="app.js?v=20261015-compact1"></script></body></html>
