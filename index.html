<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小小宠物 · 迷你画布工坊</title><link rel="stylesheet" href="style.css?v=20261015-crop2"></head><body><main><div class="workspace"><section class="editor"><div class="section-head"><h2>照片</h2><button id="reset" class="text-button">使用默认图 ↺</button></div><label id="drop" class="upload"><div class="photo-stage"><img id="original" src="default.jpg" alt="默认豚鼠照片"><canvas id="selection" aria-label="拖动框选宠物" hidden></canvas></div><span class="upload-cover">↑ 点击或拖入，换一张照片</span><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><div class="crop-actions"><button id="crop-toggle" type="button" aria-pressed="false" class="tool-button">框选宠物</button><button id="crop-clear" class="text-button" hidden>清除选框</button></div><div class="file-note"><span id="filename">小波.jpg</span><span>JPG / PNG / WebP · 最大 20 MB</span></div><button id="remove" class="primary">✦ 自动抠出宠物</button><p id="status" role="status" aria-live="polite">照片在本地处理 · 首次抠图需下载模型</p><section id="retouch" hidden><div class="section-head"><h2>修边</h2><button id="undo" class="text-button" disabled>撤销</button></div><div id="brush-modes" class="brush-modes"><button data-mode="erase" class="tool-button selected" aria-pressed="true">擦除</button><button data-mode="restore" class="tool-button" aria-pressed="false">恢复</button><label for="brush-size">画笔 <output id="brush-label">20</output></label><input id="brush-size" type="range" min="3" max="60" value="20"></div><canvas id="retouch-canvas" aria-label="用画笔擦除或恢复照片区域"></canvas><p class="retouch-note">淡色是原图参考，拖动修边；恢复可找回误删部位。</p></section><div class="section-head options-head"><h2>尺寸与描边</h2></div><label class="field-label">画布尺寸 <small>px</small></label><div id="sizes" class="sizes"><button data-size="50">50 × 50</button><button data-size="100">100 × 100</button><button class="selected" data-size="250">250 × 250</button><button data-size="500">500 × 500</button></div><div class="row"><label class="field-label" for="outline">添加描边</label><input type="checkbox" id="outline" checked></div><div id="colors" class="colors"><button data-color="#ffffff" style="--color:#ffffff" class="active" aria-label="白色"></button><button data-color="#272c29" style="--color:#272c29" aria-label="深灰"></button><button data-color="#d6ed8c" style="--color:#d6ed8c" aria-label="青柠绿"></button><button data-color="#ffb2c5" style="--color:#ffb2c5" aria-label="粉色"></button><button data-color="#b5a4ed" style="--color:#b5a4ed" aria-label="紫色"></button><button data-color="#8ecce5" style="--color:#8ecce5" aria-label="蓝色"></button><label class="custom">自定义 <input id="color" type="color" value="#ffffff" aria-label="自定义描边颜色"></label></div><div class="row"><label class="field-label" for="width">描边粗细</label><output id="width-label">4 px</output></div><input id="width" type="range" min="1" max="20" value="4"><div class="range-labels"><span>细一点</span><span>粗一点</span></div></section><section class="result"><div class="section-head"><h2>预览</h2><span class="badge">静态 GIF</span></div><div class="preview" id="preview"><div id="empty"><span>✿</span><p>抠图后预览</p></div><img id="result" alt="透明 GIF 导出效果预览" hidden></div><div class="preview-caption"><span>▧ 棋盘格代表透明区域</span><span id="dimensions">250 × 250 px</span></div><button id="download" class="primary download" disabled>↓ 下载透明 GIF</button><p class="export-note">透明底 · 单帧 GIF</p></section></div></main><script type="module" src="app.js?v=20261015-crop2"></script></body></html>
